name: Unzip project

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o BanglaSahitto_Project.zip -d extracted

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted/
